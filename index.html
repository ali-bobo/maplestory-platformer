        static drawPlayer(ctx, player, x, y) {
          const colors = CONFIG.COLORS;
          const facing = player.facing;

          const tilt = player.skillPose > 0 ? 0.12 * facing : 0;
          const armSwing = player.attackPose > 0 ? 0.8 * facing : Math.sin(player.animTime * 8) * 0.08;
          ctx.save();
          ctx.translate(x + player.w / 2, y + player.h / 2 + bob);
          ctx.scale(facing, 1);
          ctx.transform(1 + player.skillPose * 0.15, 0, 0, 1, 0, 0);
          ctx.rotate(tilt);

          ctx.beginPath(); ctx.arc(-5, -24, 3, 0, Math.PI * 2); ctx.arc(5, -24, 3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#4D4D4D';
          ctx.fillRect(12, -2, 14, 4);
          ctx.fillStyle = '#B0B0B0';
          ctx.fillRect(24, -4, 12, 8);
          ctx.fillStyle = '#7B7B7B';
          ctx.fillRect(-18, -6, 8, 14);
          ctx.fillRect(10, -6, 8, 14);
          ctx.fillStyle = '#676747';
          ctx.fillRect(-10, 22, 7, 20);
          ctx.fillRect(2, 22, 7, 20);

        static drawBoss(ctx, boss, x, y) {
          const lowHpGlow = boss.hp / boss.maxHP < 0.3 ? 0.7 + Math.sin(boss.animTime * 18) * 0.3 : 0.35;
          ctx.save();
          ctx.translate(x + boss.w / 2, y + boss.h / 2);
          ctx.scale(boss.direction, 1);

          ctx.fillStyle = `rgba(155, 48, 255, ${lowHpGlow})`;
          ctx.beginPath();
          ctx.ellipse(0, 42, 34, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(75,0,130,0.55)';
          ctx.beginPath();
          ctx.moveTo(-36, -12);
          ctx.quadraticCurveTo(-8, 62, 0, 44);
          ctx.quadraticCurveTo(8, 62, 36, -12);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = boss.flashTimer > 0 ? '#FFFFFF' : CONFIG.COLORS.boss_body;
          ctx.fillRect(-22, -6, 44, 58);
          ctx.beginPath();
          ctx.arc(0, -28, 24, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#1A0A36';
          ctx.beginPath();
          ctx.moveTo(-18, -42); ctx.lineTo(-8, -64); ctx.lineTo(-2, -38);
          ctx.moveTo(18, -42); ctx.lineTo(8, -64); ctx.lineTo(2, -38);
          ctx.fill();

          ctx.fillStyle = CONFIG.COLORS.boss_eye;
          ctx.shadowColor = 'rgba(255, 69, 0, 0.9)';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(-9, -30, 5, 0, Math.PI * 2);
          ctx.arc(9, -30, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          for (let i = 0; i < 6; i += 1) {
            const angle = boss.animTime * 2 + (Math.PI * 2 * i) / 6;
            ctx.fillStyle = 'rgba(155,48,255,0.7)';
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * 36, 10 + Math.sin(angle) * 24, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        static drawDrop(ctx, drop, x, y) {
          ctx.save();
          ctx.translate(x + drop.w / 2, y + drop.h / 2);
          if (drop.kind === 'meso') {
            ctx.fillStyle = CONFIG.COLORS.meso_color;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#7A5B00';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('M', 0, 4);
          } else {
            ctx.fillStyle = drop.kind === 'hp_potion' ? '#D32F2F' : '#1976D2';
            ctx.beginPath();
            ctx.arc(0, 2, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(-4, -10, 8, 8);
          }
          ctx.restore();
        }

        static drawPortal(ctx, x, y, unlocked, t) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = unlocked ? 'rgba(155,48,255,0.25)' : 'rgba(90,90,120,0.18)';
          ctx.beginPath();
          ctx.ellipse(0, 0, 26, 62, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = unlocked ? '#C77DFF' : '#6B7280';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, 0, 20 + Math.sin(t * 4) * 3, 54, 0, 0, Math.PI * 2);

        // ITERATION-2: Archer Goblin
        static drawArcherGoblin(ctx, monster, x, y) {
          ctx.save();
          ctx.translate(x + monster.w / 2, y + monster.h / 2);
          ctx.scale(monster.direction, 1);
          const flash = monster.flashTimer > 0;
          // body
          ctx.fillStyle = flash ? '#FFF' : '#5A8A3C';
          ctx.fillRect(-10, -6, 20, 22);
          // head
          ctx.fillStyle = flash ? '#FFF' : '#7DC55A';
          ctx.beginPath(); ctx.arc(0, -16, 12, 0, Math.PI * 2); ctx.fill();
          // pointed ears
          ctx.fillStyle = flash ? '#FFF' : '#5A8A3C';
          ctx.beginPath(); ctx.moveTo(-11, -20); ctx.lineTo(-18, -30); ctx.lineTo(-5, -22); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(11, -20); ctx.lineTo(18, -30); ctx.lineTo(5, -22); ctx.closePath(); ctx.fill();
          // eyes
          ctx.fillStyle = flash ? '#000' : '#FF0';
          ctx.beginPath(); ctx.arc(-4, -16, 2.5, 0, Math.PI * 2); ctx.arc(4, -16, 2.5, 0, Math.PI * 2); ctx.fill();
          // bow (arc)
          ctx.strokeStyle = flash ? '#FFF' : '#8B4513';
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(16, -6, 18, -0.9, 0.9); ctx.stroke();
          ctx.strokeStyle = 'rgba(200,200,220,0.8)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(16 + 18 * Math.cos(-0.9), -6 + 18 * Math.sin(-0.9));
          ctx.lineTo(16 + 18 * Math.cos(0.9), -6 + 18 * Math.sin(0.9)); ctx.stroke();
          // legs
          ctx.fillStyle = flash ? '#FFF' : '#3A5A2A';
          const legSwing = Math.sin(monster.animTime * 9) * 3;
          ctx.fillRect(-8, 16, 7, 14 + legSwing); ctx.fillRect(2, 16, 7, 14 - legSwing);
          ctx.restore();
        }

        // ITERATION-2: Stone Golem
        static drawStoneGolem(ctx, monster, x, y) {
          ctx.save();
          ctx.translate(x + monster.w / 2, y + monster.h / 2);
          ctx.scale(monster.direction, 1);
          const flash = monster.flashTimer > 0;
          const bob = Math.sin(monster.animTime * 4) * 1.5;
          ctx.translate(0, bob);
          // body (big rocky torso)
          ctx.fillStyle = flash ? '#FFF' : '#5A5A5A';
          ctx.fillRect(-22, -18, 44, 40);
          // cracks on body
          if (!flash) {
            ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-10, -15); ctx.lineTo(-4, -5); ctx.lineTo(-10, 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(14, -2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-5, 8); ctx.lineTo(5, 18); ctx.stroke();
          }
          // head
          ctx.fillStyle = flash ? '#FFF' : '#6A6A6A';
          ctx.fillRect(-16, -40, 32, 26);
          // eye glow
          ctx.fillStyle = flash ? '#FFF' : '#FF8C00';
          ctx.shadowColor = '#FF6600'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(-7, -28, 4, 0, Math.PI * 2); ctx.arc(7, -28, 4, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          // oversized fists
          ctx.fillStyle = flash ? '#FFF' : '#484848';
          const fistSwing = Math.sin(monster.animTime * 4) * 4;
          ctx.fillRect(-38, -10 + fistSwing, 18, 18);
          ctx.fillRect(22, -10 - fistSwing, 18, 18);
          // legs
          ctx.fillStyle = flash ? '#FFF' : '#4A4A4A';
          ctx.fillRect(-18, 22, 15, 22); ctx.fillRect(4, 22, 15, 22);
          ctx.restore();
        }

        // ITERATION-2: Shadow Clone visual
        static drawShadowClone(ctx, clone, x, y) {
          ctx.save();
          ctx.globalAlpha = 0.65;
          ctx.translate(x + clone.w / 2, y + clone.h / 2);
          ctx.scale(clone.facing, 1);
          // silhouette
          ctx.fillStyle = '#4B0082';
          ctx.beginPath(); ctx.arc(-1, -20, 13, 0, Math.PI * 2); ctx.fill();
          ctx.fillRect(-12, -6, 22, 42);
          // glow outline
          ctx.strokeStyle = '#9B30FF'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(-1, -20, 14, 0, Math.PI * 2); ctx.stroke();
          ctx.shadowColor = '#9B30FF'; ctx.shadowBlur = 10;
          ctx.strokeRect(-13, -7, 24, 44);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        // ITERATION-2: Equipment item visual
        static drawEquipment(ctx, drop, x, y) {
          const tierColors = { common: '#AAAAAA', rare: '#4169E1', epic: '#9B30FF' };
          const color = tierColors[drop.tier] || '#AAAAAA';
          ctx.save();
          ctx.translate(x + drop.w / 2, y + drop.h / 2);
          ctx.shadowColor = color; ctx.shadowBlur = 8;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, -11); ctx.lineTo(8, 0); ctx.lineTo(0, 11); ctx.lineTo(-8, 0);
          ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#FFF';
          ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(CONFIG.EQUIPMENT.types[drop.eqType].icon, 0, 4);
          ctx.restore();
        }
      }

      class InputManager {
        constructor() {
          this.keys = {};
          this.justPressed = {};
          window.addEventListener('keydown', (event) => {
            const action = KEY_MAP[event.code];
            if (!action) return;
            if (!this.keys[action]) {
              this.justPressed[action] = true;
            }
            this.keys[action] = true;
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'AltLeft', 'AltRight', 'Space', 'Escape'].includes(event.code)) {
              event.preventDefault();
            }
          }, { passive: false });
          window.addEventListener('keyup', (event) => {
            const action = KEY_MAP[event.code];
            if (!action) return;
            this.keys[action] = false;
          });
        }

        pressed(action) {
          return !!this.keys[action];
        }

        consume(action) {
          const value = !!this.justPressed[action];
          this.justPressed[action] = false;
          return value;
        }

        endFrame() {
          this.justPressed = {};
        }
      }

      class Camera {
        constructor() {
          this.x = 0;
          this.target = null;
          this.lockBoss = false;
        }

        update() {
          if (!this.target) return;
          const targetX = this.lockBoss
            ? CONFIG.WORLD_W - CONFIG.CANVAS_W
            : clamp(this.target.x + this.target.w / 2 - CONFIG.CANVAS_W / 2, 0, CONFIG.WORLD_W - CONFIG.CANVAS_W);
          this.x = lerp(this.x, targetX, CONFIG.CAMERA_LERP);
          this.x = clamp(this.x, 0, CONFIG.WORLD_W - CONFIG.CANVAS_W);
        }

        worldToScreen(wx) {
          return wx - this.x;
        }
      }

      class AudioSystem {
        constructor() {
          this.ctx = null;
          this.enabled = true;
        }

        ensure() {
          if (!this.enabled) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) {
              this.enabled = false;
              return null;
            }
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        beep({ frequency, duration, type = 'sine', gain = 0.02, sweepTo = null }) {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();
          oscillator.type = type;
          oscillator.frequency.setValueAtTime(frequency, now);
          if (sweepTo !== null) {
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), now + duration);
          }
          gainNode.gain.setValueAtTime(gain, now);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          oscillator.connect(gainNode).connect(ctx.destination);
          oscillator.start(now);
          oscillator.stop(now + duration);
        }

        play(name) {
          const table = {
            shuriken: () => this.beep({ frequency: 440, duration: 0.1, type: 'triangle', gain: 0.025 }),
            shadow_step: () => this.beep({ frequency: 80, duration: 0.3, type: 'sawtooth', gain: 0.05 }),
            assassinate: () => this.beep({ frequency: 1000, sweepTo: 200, duration: 0.2, type: 'square', gain: 0.03 }),
            monster_hit: () => this.beep({ frequency: 200, duration: 0.1, type: 'square', gain: 0.02 }),
            monster_die: () => this.beep({ frequency: 300, sweepTo: 100, duration: 0.3, type: 'triangle', gain: 0.03 }),
            item_pickup: () => this.beep({ frequency: 880, duration: 0.05, type: 'sine', gain: 0.02 }),
            ui_warning: () => this.beep({ frequency: 520, duration: 0.08, type: 'square', gain: 0.018 }),
          };
          if (table[name]) table[name]();
        }
      }

      // ITERATION-2: Particle System
      class ParticleSystem {
        constructor() {
          this.particles = [];
          this.maxParticles = 250;
        }

        emit(x, y, count, { color = '#FFD700', speed = 120, size = 4, life = 0.6, spread = 360, gravity = 180 } = {}) {
          const toAdd = Math.min(count, this.maxParticles - this.particles.length);
          for (let i = 0; i < toAdd; i++) {
            const angle = (spread < 360)
              ? (Math.random() - 0.5) * spread * (Math.PI / 180)
              : Math.random() * Math.PI * 2;
            const spd = speed * (0.6 + Math.random() * 0.8);
            this.particles.push({
              x, y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - (spread < 360 ? 0 : speed * 0.3),
              size: size * (0.6 + Math.random() * 0.8),
              color,
              life,
              maxLife: life,
              gravity,
            });
          }
        }

        update(dt) {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += p.gravity * dt;
            p.vx *= 0.96;
            p.life -= dt;
            if (p.life <= 0) this.particles.splice(i, 1);
          }
        }

        render(ctx, camera) {
          for (const p of this.particles) {
            const sx = camera.worldToScreen(p.x);
            if (sx < -20 || sx > CONFIG.CANVAS_W + 20) continue;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife) * 0.85;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(sx, p.y, p.size * (0.5 + 0.5 * p.life / p.maxLife), 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
          }
        }
      }

      class DamageNumber {
        constructor(x, y, value, style = 'normal') {
          this.x = x;
          this.y = y;
          this.value = value;
          this.style = style;
          this.life = 0;
          this.duration = style === 'boss' ? 1.4 : style === 'crit' ? 1.2 : style === 'heal' ? 0.8 : 1.0;
          this.dead = false;
        }

        update(dt) {
          this.life += dt;
          this.y -= 60 * dt;
          if (this.life >= this.duration) {
            this.dead = true;
          }
        }

        render(ctx, camera) {
          const alpha = 1 - this.life / this.duration;
          const screenX = camera.worldToScreen(this.x);
          const size = this.style === 'boss' ? 32 : this.style === 'crit' ? 28 : this.style === 'heal' ? 20 : 22;
          const color = this.style === 'boss'
            ? CONFIG.COLORS.damage_boss
            : this.style === 'crit'
              ? CONFIG.COLORS.damage_crit
              : this.style === 'heal'
                ? '#00FF7F'
                : CONFIG.COLORS.damage_normal;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.strokeStyle = 'rgba(0,0,0,0.7)';
          ctx.lineWidth = 4;
          ctx.font = `bold ${size}px Microsoft JhengHei`;
          ctx.textAlign = 'center';
          ctx.strokeText(String(this.value), screenX, this.y - Math.sin(this.life * 18) * 5);
          ctx.fillText(String(this.value), screenX, this.y - Math.sin(this.life * 18) * 5);
          ctx.restore();
        }
      }

      class Skill {
        constructor(type, options) {
          this.type = type;
          this.owner = options.owner;
          this.x = options.x;
          this.y = options.y;
          this.w = options.w || 18;
          this.h = options.h || 18;
          this.vx = options.vx || 0;
          this.vy = options.vy || 0;
          this.range = options.range || 0;
          this.distance = 0;
          this.size = options.size || 12;
          this.rotation = 0;
          this.color = options.color || '#FFF';
          this.damageMulti = options.damageMulti || 1;
          this.life = 0;
          this.duration = options.duration || 1.2;
          this.dead = false;
          this.hitTargets = [];
          this.warning = options.warning || false;
          this.effectData = options.effectData || null;
        }

        update(dt, game) {
          this.life += dt;
          if (this.type === 'shuriken') {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.distance += Math.abs(this.vx) * dt;
            this.rotation += Math.PI * 10 * dt;
            if (this.distance >= this.range) {
              this.dead = true;
            }
            const targets = game.getDamageableMonsters();
            for (const target of targets) {
              if (this.hitTargets.includes(target)) continue;
              if (overlap(this, target)) {
                game.damageMonster(target, game.rollPlayerDamage(this.damageMulti, false), this.x + this.w / 2, this.y, false);
                this.hitTargets.push(target);
                this.dead = true;
                break;
              }
            }
          } else if (this.type === 'afterimage') {
            if (this.life >= this.duration) this.dead = true;
          // ITERATION-2: new skill types
          } else if (this.type === 'darkVortexOrb') {
            const t = this.life / this.duration;
            const spiralAngle = (this.effectData.baseAngle || 0) + this.life * 6;
            const radius = 80 * Math.sin(t * Math.PI);
            this.x = this.owner.x + this.owner.w / 2 + Math.cos(spiralAngle) * radius;
            this.y = this.owner.y + this.owner.h / 2 + Math.sin(spiralAngle) * radius * 0.5;
            if (this.life >= this.duration) this.dead = true;
          } else if (this.type === 'archerArrow') {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.distance += Math.abs(this.vx) * dt;
            if (this.distance >= (this.range || 400)) { this.dead = true; }
            // hit player
            if (overlap({ x: game.player.x, y: game.player.y, w: game.player.w, h: game.player.h }, { x: this.x, y: this.y, w: 12, h: 8 })) {
              game.player.takeDamage(this.effectData.damage || 20, game);
              this.dead = true;
            }
          } else if (this.type === 'slash') {
            if (this.life >= this.duration) this.dead = true;
          } else if (this.type === 'bossWarning' || this.type === 'bossShockwave' || this.type === 'bossExplosion') {
            if (this.life >= this.duration) this.dead = true;
          }
        }

        render(ctx, camera) {
          const screenX = camera.worldToScreen(this.x);
          if (screenX < -150 || screenX > CONFIG.CANVAS_W + 150) return;

          if (this.type === 'shuriken') {
            ctx.save();
            ctx.translate(screenX + this.w / 2, this.y + this.h / 2);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i += 1) {
              ctx.rotate(Math.PI / 2);
              ctx.beginPath();
              ctx.moveTo(0, -this.size);
              ctx.lineTo(4, 0);
              ctx.lineTo(0, this.size);
              ctx.lineTo(-4, 0);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
            ctx.restore();
          } else if (this.type === 'afterimage') {
            ctx.save();
            ctx.globalAlpha = 0.45 * (1 - this.life / this.duration);
            AssetManager.drawPlayer(ctx, this.effectData.playerSnapshot, screenX, this.y);
            ctx.restore();
          // ITERATION-2: render new types
          } else if (this.type === 'darkVortexOrb') {
            const screenOrbX = camera.worldToScreen(this.x);
            ctx.save();
            ctx.globalAlpha = 1 - this.life / this.duration;
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(screenOrbX, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
          } else if (this.type === 'archerArrow') {
            const arrowScreenX = camera.worldToScreen(this.x);
            ctx.save();
            ctx.translate(arrowScreenX, this.y);
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.fillStyle = '#C8A96B';
            ctx.fillRect(-10, -2, 20, 4);
            ctx.fillStyle = '#555';
            ctx.beginPath(); ctx.moveTo(10,-4); ctx.lineTo(16,0); ctx.lineTo(10,4); ctx.closePath(); ctx.fill();
            ctx.restore();
          } else if (this.type === 'slash') {
            ctx.save();
            ctx.translate(screenX, this.y);
            ctx.globalAlpha = 1 - this.life / this.duration;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-40, -30);
            ctx.lineTo(40, 30);
            ctx.moveTo(40, -30);
            ctx.lineTo(-40, 30);
            ctx.stroke();
            ctx.restore();
          } else if (this.type === 'bossWarning') {
            ctx.save();
            ctx.globalAlpha = 0.2 + Math.sin(this.life * 16) * 0.15;
            ctx.fillStyle = 'rgba(255,0,0,0.5)';
            ctx.fillRect(screenX, this.y, this.w, this.h);
            ctx.restore();
          } else if (this.type === 'bossShockwave') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255,220,120,0.75)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(screenX, this.y);
            ctx.lineTo(screenX + this.w, this.y + Math.sin(this.life * 30) * 14);
            ctx.stroke();
            ctx.restore();
          } else if (this.type === 'bossExplosion') {
            ctx.save();
            ctx.globalAlpha = 1 - this.life / this.duration;
            ctx.fillStyle = 'rgba(255,80,0,0.28)';
            ctx.beginPath();
            ctx.arc(screenX, this.y, 30 + this.life * 70, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      class Map {
        constructor() {
          this.platforms = CONFIG.PLATFORMS.map((platform) => ({ ...platform, color: platform.color || CONFIG.COLORS.platform_body }));
          this.decorMushrooms = Array.from({ length: 18 }, (_, index) => ({
            x: 120 + index * 200 + rand(-40, 40),
            y: 616,
            scale: rand(0.8, 1.2),
          }));
          this.bushes = Array.from({ length: 45 }, (_, index) => ({ x: index * 88 + rand(-10, 10), y: 624, size: rand(12, 24) }));
        }

        getGroundHeightAt(x, probeY = 0) {
          let best = CONFIG.FLOOR_Y;
          for (const platform of this.platforms) {
            if (x >= platform.x - 4 && x <= platform.x + platform.w + 4) {
              if (platform.y >= probeY && platform.y < best) {
                best = platform.y;
              }
            }
          }
          return best;
        }

        getSupportPlatform(x, y) {
          let best = null;
          for (const platform of this.platforms) {
            if (x >= platform.x && x <= platform.x + platform.w) {
              if (Math.abs(platform.y - y) < 60 || platform.y >= y) {
                if (!best || platform.y < best.y) {
                  best = platform;
                }
              }
            }
          }
          return best || this.platforms[0];
        }

        resolveEntity(entity, prevY, allowThin = true) {
          entity.onGround = false;
          for (const platform of this.platforms) {
            const top = platform.y;
            const prevBottom = prevY + entity.h;
            const currBottom = entity.y + entity.h;
            const withinX = entity.x + entity.w > platform.x && entity.x < platform.x + platform.w;
            if (!withinX) continue;

            const isThin = platform.type === 'thin';
            if (isThin && (!allowThin || entity.dropThroughTimer > 0)) continue;

            if (entity.vy >= 0 && prevBottom <= top + 6 && currBottom >= top && entity.y + entity.h <= top + platform.h + 12) {
              entity.y = top - entity.h;
              entity.vy = 0;
              entity.onGround = true;
              entity.jumpsUsed = 0;
              entity.support = platform;
            }
          }
          if (entity.y + entity.h >= CONFIG.WORLD_H) {
            entity.y = CONFIG.WORLD_H - entity.h;
            entity.vy = 0;
            entity.onGround = true;
            entity.jumpsUsed = 0;
          }
        }

        renderBackground(ctx, camera, time) {
          // ITERATION-2: blend sky to dark purple in forest zone
          const forestStart = 3840;
          const forestBlend = clamp((camera.x - forestStart + 800) / 1200, 0, 1);
          const skyTop = forestBlend > 0
            ? `hsl(${lerp(210, 270, forestBlend)},${lerp(60, 40, forestBlend)}%,${lerp(67, 18, forestBlend)}%)`
            : '#87CEEB';
          const skyBot = forestBlend > 0
            ? `hsl(${lerp(200, 260, forestBlend)},${lerp(55, 35, forestBlend)}%,${lerp(87, 28, forestBlend)}%)`
            : '#D4F1FF';
          const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.CANVAS_H);
          grad.addColorStop(0, skyTop);
          grad.addColorStop(1, skyBot);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          for (let i = 0; i < 8; i += 1) {
            const cloudX = ((i * 380) - camera.x * 0.06 + time * 6) % (CONFIG.CANVAS_W + 300) - 150;
            const cloudY = 80 + (i % 3) * 50;
            this.drawCloud(ctx, cloudX, cloudY, 1 + (i % 2) * 0.3);
          }

          this.drawMountains(ctx, camera.x * CONFIG.PARALLAX_LAYERS[1].speedRatio);
          this.drawForest(ctx, camera.x * CONFIG.PARALLAX_LAYERS[2].speedRatio, CONFIG.COLORS.bg_tree_dark, 460, 1.3);
          this.drawForest(ctx, camera.x * CONFIG.PARALLAX_LAYERS[3].speedRatio, CONFIG.COLORS.bg_tree_mid, 520, 1);

          ctx.fillStyle = CONFIG.COLORS.bg_grass;
          for (const bush of this.bushes) {
            const screenX = bush.x - camera.x * CONFIG.PARALLAX_LAYERS[4].speedRatio;
            if (screenX < -40 || screenX > CONFIG.CANVAS_W + 40) continue;
            ctx.beginPath();
            ctx.arc(screenX, bush.y, bush.size, Math.PI, Math.PI * 2);
            ctx.arc(screenX + bush.size * 0.7, bush.y, bush.size * 0.7, Math.PI, Math.PI * 2);
            ctx.arc(screenX - bush.size * 0.7, bush.y, bush.size * 0.6, Math.PI, Math.PI * 2);
            ctx.fill();
          }
        }

        drawCloud(ctx, x, y, scale) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.arc(20, -8, 18, 0, Math.PI * 2);
          ctx.arc(38, 2, 20, 0, Math.PI * 2);
          ctx.arc(16, 10, 20, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        drawMountains(ctx, offset) {
          ctx.fillStyle = '#1A3A5C';
          ctx.beginPath();
          ctx.moveTo(-200 - offset % 300, 500);
          for (let i = -1; i < 8; i += 1) {
            const baseX = i * 300 - (offset % 300);
            ctx.lineTo(baseX, 500);
            ctx.lineTo(baseX + 120, 320 + (i % 2) * 40);
            ctx.lineTo(baseX + 240, 500);
          }
          ctx.lineTo(CONFIG.CANVAS_W + 200, 720);
          ctx.lineTo(-200, 720);
          ctx.closePath();
          ctx.fill();
        }

        drawForest(ctx, offset, color, baseY, scale) {
          ctx.fillStyle = color;
          for (let i = -1; i < 16; i += 1) {
            const x = i * 120 - (offset % 120);
            const height = 60 + (i % 4) * 18;
            ctx.fillRect(x + 16, baseY - height * 0.35, 14 * scale, height * 0.5);
            ctx.beginPath();
            ctx.arc(x + 22, baseY - height, 28 * scale, 0, Math.PI * 2);
            ctx.arc(x + 6, baseY - height + 12, 24 * scale, 0, Math.PI * 2);
            ctx.arc(x + 38, baseY - height + 10, 22 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        renderWorld(ctx, camera, time) {
          for (const platform of this.platforms) {
            const screenX = camera.worldToScreen(platform.x);
            if (screenX > CONFIG.CANVAS_W + 100 || screenX + platform.w < -100) continue;
            ctx.fillStyle = platform.type === 'solid' ? '#6B7280' : platform.color;
            ctx.fillRect(screenX, platform.y, platform.w, platform.h);
            ctx.fillStyle = CONFIG.COLORS.platform_top;
            ctx.fillRect(screenX, platform.y, platform.w, Math.min(platform.h, 8));
            ctx.fillStyle = CONFIG.COLORS.platform_edge;
            ctx.fillRect(screenX, platform.y + 7, platform.w, 3);
          }

          for (const decor of this.decorMushrooms) {
            const screenX = camera.worldToScreen(decor.x);
            if (screenX < -40 || screenX > CONFIG.CANVAS_W + 40) continue;
            ctx.save();
            ctx.translate(screenX, decor.y);
            ctx.scale(decor.scale, decor.scale);
            ctx.fillStyle = '#F5DEB3';
            ctx.fillRect(-5, -10, 10, 14);
            ctx.fillStyle = '#E8543A';
            ctx.beginPath();
            ctx.arc(0, -12, 12, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#FFF';
            ctx.beginPath(); ctx.arc(-4, -14, 2, 0, Math.PI * 2); ctx.arc(4, -18, 2, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          }

          for (const sign of CONFIG.DECORATIONS.signs) {
            const screenX = camera.worldToScreen(sign.x);
            if (screenX < -80 || screenX > CONFIG.CANVAS_W + 80) continue;
            ctx.fillStyle = '#7B4F24';
            ctx.fillRect(screenX, sign.y - 26, 8, 24);
            ctx.fillStyle = '#C8A96B';
            ctx.fillRect(screenX - 24, sign.y - 54, 56, 28);
            ctx.fillStyle = '#2D1B69';
            ctx.font = '12px Microsoft JhengHei';
            ctx.textAlign = 'center';
            ctx.fillText(sign.text, screenX + 4, sign.y - 36);
          }
        }
      }

      class Player {
        constructor() {
          this.w = CONFIG.PLAYER_STATS.width;
          this.h = CONFIG.PLAYER_STATS.height;
          this.reset();
        }

        reset(spawn = CONFIG.PLAYER_SPAWN) {
          this.x = spawn.x;
          this.y = spawn.y - this.h;
          this.vx = 0;
          this.vy = 0;
          this.maxHP = CONFIG.PLAYER_STATS.maxHP;
          this.maxMP = CONFIG.PLAYER_STATS.maxMP;
          this.hp = this.maxHP;
          this.mp = this.maxMP;
          this.attack = CONFIG.PLAYER_STATS.attack;
          this.speed = CONFIG.PLAYER_STATS.speed;
          this.facing = 1;
          this.onGround = false;
          this.jumpsUsed = 0;
          this.dropThroughTimer = 0;
          this.dashTimer = 0;
          this.dashHitTargets = [];
          this.invincibleTimer = 0;
          this.attackPose = 0;
          this.skillPose = 0;
          this.damageFlash = 0;
          this.animTime = 0;
          this.meso = 0;
          this.cooldowns = { shadowStep: 0, assassinate: 0, darkVortex: 0, shadowCloneSkill: 0 };
          this.equipment = { weapon: null, armor: null, gloves: null }; // ITERATION-2
          this.support = null;
        }

        getHorizontalBounds(game) {
          return {
            min: game.bossMode ? 3600 : 0,
            max: CONFIG.WORLD_W - this.w,
          };
        }

        update(dt, game) {
          this.animTime += dt;
          this.attackPose = Math.max(0, this.attackPose - dt * 3);
          this.skillPose = Math.max(0, this.skillPose - dt * 3);
          this.damageFlash = Math.max(0, this.damageFlash - dt * 4);
          this.invincibleTimer = Math.max(0, this.invincibleTimer - dt);
          this.dropThroughTimer = Math.max(0, this.dropThroughTimer - dt);
          this.cooldowns.shadowStep = Math.max(0, this.cooldowns.shadowStep - dt);
          this.cooldowns.assassinate = Math.max(0, this.cooldowns.assassinate - dt);
          this.cooldowns.darkVortex = Math.max(0, this.cooldowns.darkVortex - dt);       // ITERATION-2
          this.cooldowns.shadowCloneSkill = Math.max(0, this.cooldowns.shadowCloneSkill - dt); // ITERATION-2

          this.hp = clamp(this.hp + CONFIG.RECOVERY.hpRegen * dt, 0, this.maxHP);
          this.mp = clamp(this.mp + CONFIG.RECOVERY.mpRegen * dt, 0, this.maxMP);

          if (game.input.consume('jump')) {
            this.jump(game.input.pressed('down'));
          }
          if (game.input.consume('skill1')) {
            this.castShuriken(game);
          }
          if (game.input.consume('skill2')) {
            this.castShadowStep(game);
          }
          if (game.input.consume('skill3')) {
            this.castAssassinate(game);
          }
          if (game.input.consume('skill4')) { this.castDarkVortex(game); }   // ITERATION-2
          if (game.input.consume('skill5')) { this.castShadowClone(game); }  // ITERATION-2

          const prevY = this.y;
          if (this.dashTimer > 0) {
            this.dashTimer -= dt;
            const dashSpeed = CONFIG.SKILLS.shadowStep.distance / CONFIG.SKILLS.shadowStep.duration;
            this.vx = dashSpeed * this.facing;
            this.vy = 0;
            this.skillPose = 1;
            game.spawnAfterimage(this);
            this.applyDashDamage(game);
            if (this.dashTimer <= 0) {
              this.invincibleTimer = Math.max(this.invincibleTimer, 0.2);
            }
          } else {
            const move = (game.input.pressed('left') ? -1 : 0) + (game.input.pressed('right') ? 1 : 0);
            if (move !== 0) {
              this.facing = move;
              this.vx = move * this.speed;
            } else {
              this.vx = lerp(this.vx, 0, clamp(dt / 0.1, 0, 1));
            }
            this.vy += CONFIG.PLAYER_STATS.gravity * dt;
          }

          this.x += this.vx * dt;
          const bounds = this.getHorizontalBounds(game);
          this.x = clamp(this.x, bounds.min, bounds.max);
          this.y += this.vy * dt;

          game.map.resolveEntity(this, prevY, true);
        }

        jump(dropThrough) {
          if (dropThrough && this.onGround && this.support && this.support.type === 'thin') {
            this.dropThroughTimer = 0.25;
            this.onGround = false;
            this.y += 6;
            return;
          }
          if (this.onGround || this.jumpsUsed < 1) {
            this.vy = -(CONFIG.PLAYER_STATS.jumpPower * (this.jumpsUsed === 0 ? 1 : 0.85));
            this.onGround = false;
            this.jumpsUsed += 1;
          }
        }

        spendMP(cost, game) {
          if (this.mp < cost) {
            game.notify('MP 不足');
            game.audio.play('ui_warning');
            return false;
          }
          this.mp -= cost;
          return true;
        }

        castShuriken(game) {
          const skill = CONFIG.SKILLS.shuriken;
          if (!this.spendMP(skill.mpCost, game)) return;
          this.attackPose = 1;
          this.skillPose = 0.4;
          game.audio.play('shuriken');
          const spreads = [-skill.spread, 0, skill.spread];
          spreads.forEach((offsetY) => {
            game.skills.push(new Skill('shuriken', {
              owner: this,
              x: this.x + (this.facing > 0 ? this.w : -12),
              y: this.y + 18 + offsetY,
              w: 16,
              h: 16,
              vx: skill.speed * this.facing,
              vy: 0,
              range: skill.range,
              size: skill.size,
              color: skill.color,
              damageMulti: skill.damageMulti,
            }));
          });
        }

        castShadowStep(game) {
          const skill = CONFIG.SKILLS.shadowStep;
          if (this.cooldowns.shadowStep > 0) return;
          if (!this.spendMP(skill.mpCost, game)) return;
          this.cooldowns.shadowStep = skill.cooldown;
          this.dashTimer = skill.duration;
          this.dashHitTargets = [];
          this.invincibleTimer = skill.duration;
          this.skillPose = 1;
          game.audio.play('shadow_step');
        }

        castAssassinate(game) {
          const skill = CONFIG.SKILLS.assassinate;
          if (this.cooldowns.assassinate > 0) return;
          const target = game.findNearestMonster(this.x + this.w / 2, this.y + this.h / 2, skill.range);
          if (!target) {
            game.notify('沒有可暗殺目標');
            return;
          }
          if (!this.spendMP(skill.mpCost, game)) return;
          this.cooldowns.assassinate = skill.cooldown;
          this.facing = target.x < this.x ? -1 : 1;
          const bounds = this.getHorizontalBounds(game);
          this.x = clamp(target.x - this.facing * 56, bounds.min, bounds.max);
          this.y = target.y;
          this.attackPose = 1;
          this.skillPose = 1;
          game.skills.push(new Skill('slash', {
            owner: this,
            x: target.x + target.w / 2,
            y: target.y + target.h / 2,
            color: skill.color,
            duration: 0.35,
          }));
          game.audio.play('assassinate');
          game.damageMonster(target, game.rollPlayerDamage(skill.damageMulti, true), target.x + target.w / 2, target.y, true, skill.stunDuration);
        }

        // ITERATION-2: equipment stat getters
        getEffectiveAttack() {
          const eq = this.equipment.weapon;
          if (!eq) return this.attack;
          const tier = CONFIG.EQUIPMENT.tiers[eq.tier];
          return Math.floor(this.attack + CONFIG.EQUIPMENT.types.weapon.baseBonus * (1 + tier.bonus * 5));
        }
        getEffectiveMaxHP() {
          const eq = this.equipment.armor;
          if (!eq) return this.maxHP;
          const tier = CONFIG.EQUIPMENT.tiers[eq.tier];
          return this.maxHP + Math.floor(CONFIG.EQUIPMENT.types.armor.baseBonus * (1 + tier.bonus * 5));
        }
        getEffectiveCritRate() {
          const eq = this.equipment.gloves;
          if (!eq) return CONFIG.PLAYER_STATS.critRate;
          const tier = CONFIG.EQUIPMENT.tiers[eq.tier];
          return Math.min(0.8, CONFIG.PLAYER_STATS.critRate + CONFIG.EQUIPMENT.types.gloves.baseBonus * (1 + tier.bonus * 5));
        }

        // ITERATION-2: Dark Vortex — AoE spin attack
        castDarkVortex(game) {
          const skill = CONFIG.SKILLS.darkVortex;
          if (this.cooldowns.darkVortex > 0) return;
          if (!this.spendMP(skill.mpCost, game)) return;
          this.cooldowns.darkVortex = skill.cooldown;
          this.skillPose = 1;
          game.audio.play('shadow_step');
          const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
          // damage all monsters in radius
          for (const monster of game.getDamageableMonsters()) {
            const mx = monster.x + monster.w / 2, my = monster.y + monster.h / 2;
            if (Math.hypot(mx - cx, my - cy) <= skill.radius) {
              game.damageMonster(monster, game.rollPlayerDamage(skill.damageMulti, false), mx, monster.y, false);
            }
          }
          // vortex visual — 8 spiraling orbs
          for (let i = 0; i < 8; i++) {
            const baseAngle = (i / 8) * Math.PI * 2;
            game.skills.push(new Skill('darkVortexOrb', {
              owner: this, x: cx, y: cy,
              vx: Math.cos(baseAngle) * 180, vy: Math.sin(baseAngle) * 180,
              color: skill.color, size: 7, duration: 0.8,
              damageMulti: 0, effectData: { baseAngle },
            }));
          }
          game.particles.emit(cx, cy, 20, { color: '#6A0DAD', speed: 200, life: 0.7, gravity: -50 });
        }

        // ITERATION-2: Shadow Clone — summon fighting copy
        castShadowClone(game) {
          const skill = CONFIG.SKILLS.shadowCloneSkill;
          if (this.cooldowns.shadowCloneSkill > 0) return;
          if (!this.spendMP(skill.mpCost, game)) return;
          this.cooldowns.shadowCloneSkill = skill.cooldown;
          game.shadowClone = {
            x: this.x, y: this.y, w: this.w, h: this.h,
            facing: this.facing, life: skill.cloneDuration,
            attackTimer: 0, animTime: 0,
          };
          game.notify('影分身已召喚！');
          game.particles.emit(this.x + this.w / 2, this.y + this.h / 2, 15, { color: '#9B30FF', speed: 150, life: 0.6 });
        }

        applyDashDamage(game) {
          const hitbox = {
            x: this.x - 6,
            y: this.y,
            w: this.w + 12,
            h: this.h,
          };
          for (const monster of game.getDamageableMonsters()) {
            if (this.dashHitTargets.includes(monster)) continue;
            if (overlap(hitbox, monster)) {
              this.dashHitTargets.push(monster);
              game.damageMonster(monster, game.rollPlayerDamage(CONFIG.SKILLS.shadowStep.damageMulti, false), monster.x + monster.w / 2, monster.y, false);
            }
          }
        }

        takeDamage(amount, game) {
          if (this.invincibleTimer > 0 || game.state !== 'playing') return;
          this.hp = Math.max(0, this.hp - amount);
          this.damageFlash = 1;
          this.invincibleTimer = 0.6;
          game.damageNumbers.push(new DamageNumber(this.x + this.w / 2, this.y, amount, 'boss'));
          if (this.hp <= 0) {
            game.setState('game_over');
          }
        }
      }

      class Monster {
        constructor(definition, x, y, spawnController = null) {
          this.definition = definition;
          this.kind = definition.id;
          this.x = x;
          this.y = y;
          this.w = definition.width;
          this.h = definition.height;
          this.homeX = x;
          this.homeY = y;
          this.maxHP = definition.hp;
          this.hp = definition.hp;
          this.attack = definition.attack;
          this.speed = definition.speed;
          this.direction = Math.random() > 0.5 ? 1 : -1;
          this.state = 'patrol';
          this.aggroRange = definition.aggroRange;
          this.attackRange = definition.attackRange;
          this.attackCooldown = definition.attackCooldown;
          this.attackTimer = rand(0.2, 0.8);
          this.flashTimer = 0;
          this.animTime = rand(0, 10);
          this.dead = false;
          this.deathTime = 0;
          this.rotation = 0;
          this.scale = 1;
          this.spawnController = spawnController;
          this.support = null;
          this.stunTimer = 0;
        }

        update(dt, game) {
          this.animTime += dt;
          this.flashTimer = Math.max(0, this.flashTimer - dt);
          this.attackTimer = Math.max(0, this.attackTimer - dt);
          this.stunTimer = Math.max(0, this.stunTimer - dt);

          if (this.state === 'dead') {
            this.deathTime += dt;
            this.rotation += dt * 8;
            this.scale = Math.max(0, 1 - this.deathTime / 0.5);
            if (this.deathTime >= 0.5) this.dead = true;
            return;
          }

          const player = game.player;
          const dx = (player.x + player.w / 2) - (this.x + this.w / 2);
          const dy = Math.abs((player.y + player.h / 2) - (this.y + this.h / 2));
          const absDx = Math.abs(dx);
          const samePlane = dy < 140;
          if (this.stunTimer > 0) return;

          // ITERATION-2: edge/wall fix — clamp to platform BEFORE applying movement
          if (this.support) {
            const lb = this.support.x + 1;
            const rb = this.support.x + this.support.w - this.w - 1;
            this.x = clamp(this.x, lb, rb);
            // pre-turn at edges to prevent sticking
            if (this.x <= lb + 4) this.direction = 1;
            if (this.x >= rb - 4) this.direction = -1;
          }

          // ITERATION-2: Archer Goblin — ranged AI (stay at distance, fire arrows)
          if (this.kind === 'archerGoblin') {
            this.direction = dx >= 0 ? 1 : -1;
            if (absDx <= this.aggroRange && samePlane) {
              this.state = 'aggro';
              const keepDist = this.definition.keepDistance || 200;
              // back away if too close
              if (absDx < 100) {
                this.x -= this.direction * this.speed * dt;
              } else if (absDx > keepDist + 30) {
                this.x += this.direction * this.speed * 0.5 * dt;
              }
              if (this.attackTimer <= 0) {
                this.attackTimer = this.attackCooldown;
                // fire arrow projectile
                game.spawnArcherArrow(this, player);
              }
            } else {
              this.state = 'patrol';
              this.x += this.direction * this.speed * dt;
              if (Math.abs(this.x - this.homeX) > 140) this.direction *= -1;
            }
          } else if (absDx <= this.attackRange && samePlane) {
            // Normal melee attack
            this.state = 'aggro';
            this.direction = dx >= 0 ? 1 : -1;
            if (this.attackTimer <= 0) {
              this.attackTimer = this.attackCooldown;
              const dmg = game.rollMonsterDamage(this.attack);
              player.takeDamage(dmg, game);
              // ITERATION-2: screen-shake for golem
              if (this.kind === 'stoneGolem') game.screenShake(0.3, 6);
            }
            return;
          } else if (absDx <= this.aggroRange && samePlane) {
            this.state = 'aggro';
            this.direction = dx >= 0 ? 1 : -1;
            // ITERATION-2: edge-safe aggro movement
            const canMoveRight = !this.support || this.x < this.support.x + this.support.w - this.w - 2;
            const canMoveLeft  = !this.support || this.x > this.support.x + 2;
            const wantRight = dx > 0;
            if ((wantRight && canMoveRight) || (!wantRight && canMoveLeft)) {
              this.x += Math.sign(dx) * this.speed * dt;
            }
          } else {
            this.state = 'patrol';
            const canMoveRight = !this.support || this.x < this.support.x + this.support.w - this.w - 2;
            const canMoveLeft  = !this.support || this.x > this.support.x + 2;
            if ((this.direction > 0 && canMoveRight) || (this.direction < 0 && canMoveLeft)) {
              this.x += this.direction * this.speed * dt;
            } else {
              this.direction *= -1;
            }
            if (Math.abs(this.x - this.homeX) > 150) this.direction *= -1;
          }

          // Snap to platform y
          if (this.support) {
            const lb = this.support.x + 1;
            const rb = this.support.x + this.support.w - this.w - 1;
            this.x = clamp(this.x, lb, rb);
            this.y = this.support.y - this.h;
          } else {
            // edge detection for ground monsters
            const nextX = this.x + this.direction * this.speed * 0.08;
            const groundAhead = game.map.getGroundHeightAt(nextX + this.w / 2, this.homeY + 50);
            if (groundAhead > this.homeY + 50) this.direction *= -1;
            this.y = game.map.getGroundHeightAt(this.x + this.w / 2, this.homeY) - this.h;
          }
        }

        hurt(damage, stun = 0) {
          if (this.state === 'dead') return;
          this.hp -= damage;
          this.flashTimer = 0.2;
          this.stunTimer = Math.max(this.stunTimer, stun);
          if (this.hp <= 0) {
            this.die();
          }
        }

        die() {
          this.state = 'dead';
          this.deathTime = 0;
        }

        render(ctx, camera) {
          const screenX = camera.worldToScreen(this.x);
          if (screenX < -120 || screenX > CONFIG.CANVAS_W + 120) return;
          ctx.save();
          ctx.translate(screenX + this.w / 2, this.y + this.h / 2);
          ctx.rotate(this.rotation);
          ctx.scale(this.scale, this.scale);
          ctx.translate(-(screenX + this.w / 2), -(this.y + this.h / 2));
          if (this.kind === 'slime' || this.kind === 'shadowMinion') {
            AssetManager.drawSlime(ctx, this, screenX, this.y + (this.kind === 'shadowMinion' ? 6 : 0));
          } else if (this.kind === 'mushroom') {
            AssetManager.drawMushroom(ctx, this, screenX, this.y);
          } else if (this.kind === 'zombie') {
            AssetManager.drawZombie(ctx, this, screenX, this.y);
          } else if (this.kind === 'archerGoblin') {
            AssetManager.drawArcherGoblin(ctx, this, screenX, this.y);
          } else if (this.kind === 'stoneGolem') {
            AssetManager.drawStoneGolem(ctx, this, screenX, this.y);
          }
          ctx.restore();

          if (this.state !== 'dead' && this.maxHP > 0) {
            const ratio = this.hp / this.maxHP;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(screenX - 4, this.y - 14, this.w + 8, 6);
            ctx.fillStyle = '#D32F2F';
            ctx.fillRect(screenX - 4, this.y - 14, (this.w + 8) * ratio, 6);
          }
        }
      }

      class Boss extends Monster {
        constructor(x, y) {
          super({
            id: 'boss',
            hp: CONFIG.BOSS.hp,
            attack: CONFIG.BOSS.attack,
            exp: CONFIG.BOSS.exp,
            mesoRange: [200, 400],
            speed: CONFIG.BOSS.speed,
            aggroRange: 9999,
            attackRange: 110,
            attackCooldown: 1.2,
            width: CONFIG.BOSS.width,
            height: CONFIG.BOSS.height,
          }, x, y);
          this.name = CONFIG.BOSS.name;
          this.patternTimer = 2;
          this.currentPattern = null;
          this.warningIssued = false;
          this.comboHitsLeft = 0;
          this.comboTimer = 0;
          this.support = { x: 5560, y: 640, w: 280, h: 80 }; // ITERATION-2
        }

        get phase() {
          const ratio = this.hp / this.maxHP;
          if (ratio > 0.6) return 1;
          if (ratio > 0.3) return 2;
          return 3;
        }

        choosePattern() {
          if (this.phase === 1) return choice(['ground_slam', 'normal']);
          if (this.phase === 2) return choice(['ground_slam', 'shadow_summon', 'normal']);
          return choice(['ground_slam', 'shadow_summon', 'berserk_combo', 'normal']);
        }

        update(dt, game) {
          this.animTime += dt;
          this.flashTimer = Math.max(0, this.flashTimer - dt);
          if (this.state === 'dead') {
            this.deathTime += dt;
            this.scale = Math.max(0, 1 - this.deathTime / 1.2);
            this.rotation += dt * 3;
            if (this.deathTime >= 1.2) {
              this.dead = true;
              game.setState('victory');
            }
            return;
          }

          this.x = clamp(this.x, 5564, 5720); // ITERATION-2
          this.y = this.support.y - this.h;
          const player = game.player;
          this.direction = player.x < this.x ? -1 : 1;
          this.patternTimer -= dt;

          if (this.comboHitsLeft > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0) {
              this.comboTimer = 0.18;
              this.comboHitsLeft -= 1;
              this.x = clamp(player.x + (this.comboHitsLeft % 2 === 0 ? -50 : 50), 3604, 3750);
              player.takeDamage(game.rollMonsterDamage(this.attack * 1.5), game);
              game.skills.push(new Skill('bossExplosion', {
                x: player.x + player.w / 2,
                y: player.y + player.h / 2,
                duration: 0.25,
              }));
              if (this.comboHitsLeft <= 0) {
                this.patternTimer = 2;
                this.currentPattern = null;
              }
            }
            return;
          }

          if (!this.currentPattern && this.patternTimer <= 0) {
            this.currentPattern = this.choosePattern();
            this.warningIssued = false;
          }

          if (!this.currentPattern) {
            const dx = player.x - this.x;
            if (Math.abs(dx) > 120) {
              this.x += Math.sign(dx) * this.speed * 0.5 * dt;
            }
            return;
          }

          if (this.currentPattern === 'normal') {
            if (distance(this.x, this.y, player.x, player.y) < 120) {
              player.takeDamage(game.rollMonsterDamage(this.attack), game);
            }
            this.currentPattern = null;
            this.patternTimer = this.phase === 1 ? 3 : this.phase === 2 ? 2.5 : 2;
          } else if (this.currentPattern === 'ground_slam') {
            if (!this.warningIssued) {
              this.warningIssued = true;
              game.skills.push(new Skill('bossWarning', {
                x: this.x - 300,
                y: 590,
                w: 600,
                h: 50,
                duration: 0.8,
              }));
              this.patternTimer = 0.8;
            } else if (this.patternTimer <= 0) {
              game.skills.push(new Skill('bossShockwave', {
                x: this.x - 300,
                y: 618,
                w: 600,
                duration: 0.55,
              }));
              if (Math.abs((player.x + player.w / 2) - (this.x + this.w / 2)) <= 300 && player.y + player.h >= 590) {
                player.takeDamage(game.rollMonsterDamage(this.attack * 2), game);
              }
              this.currentPattern = null;
              this.patternTimer = this.phase === 1 ? 3 : this.phase === 2 ? 2.5 : 2;
            }
          } else if (this.currentPattern === 'shadow_summon') {
            for (let i = 0; i < 3; i += 1) {
              game.spawnShadowMinion(5620 + i * 52, 620); // ITERATION-2
            }
            this.currentPattern = null;
            this.patternTimer = this.phase === 2 ? 2.5 : 2;
          } else if (this.currentPattern === 'berserk_combo') {
            this.comboHitsLeft = 4;
            this.comboTimer = 0.1;
            this.currentPattern = null;
          }
        }

        render(ctx, camera) {
          const screenX = camera.worldToScreen(this.x);
          ctx.save();
          ctx.translate(screenX + this.w / 2, this.y + this.h / 2);
          ctx.rotate(this.rotation);
          ctx.scale(this.scale, this.scale);
          ctx.translate(-(screenX + this.w / 2), -(this.y + this.h / 2));
          AssetManager.drawBoss(ctx, this, screenX, this.y);
          ctx.restore();
        }
      }

      class Game {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext('2d');
          this.input = new InputManager();
          this.map = new Map();
          this.camera = new Camera();
          this.player = new Player();
          this.ui = new UI();
          this.audio = new AudioSystem();
          this.particles = new ParticleSystem(); // ITERATION-2
          this.state = 'start';
          this.time = 0;
          this.playTime = 0;
          this.killCount = 0;
          this.maxDamage = 0;
          this.skills = [];
          this.damageNumbers = [];
          this.monsters = [];
          this.drops = [];
          this.spawnControllers = [];
          this.portalUnlocked = false;
          this.bossMode = false;
          this.boss = null;
          this.shadowClone = null;              // ITERATION-2
          this.combo = { count: 0, timer: 0 }; // ITERATION-2
          this.screenShakeTimer = 0;            // ITERATION-2
          this.screenShakeIntensity = 0;        // ITERATION-2
          this.notification = { text: '', timer: 0, duration: 0 };
          this.errorMessage = '';
          this.lastAfterimage = 0;
          this.setupSpawnControllers();
          this.resetWorld();
          this.camera.target = this.player;

          window.addEventListener('keydown', () => {
            if (this.state === 'start') {
              this.audio.ensure();
              this.setState('playing');
            } else if (this.state === 'victory' || this.state === 'game_over') {
              this.restart();
            }
          });
        }

        setupSpawnControllers() {
          this.spawnControllers = [];
          ['slime', 'mushroom', 'zombie', 'archerGoblin', 'stoneGolem'].forEach((key) => { // ITERATION-2
            const def = CONFIG.MONSTERS[key];
            for (let i = 0; i < def.spawnCount; i += 1) {
              const zone = def.spawnZones[i % def.spawnZones.length];
              this.spawnControllers.push({ definition: def, zone, timer: rand(0, 2), activeMonster: null });
            }
          });
        }

        resetWorld() {
          this.player.reset();
          this.killCount = 0;
          this.maxDamage = 0;
          this.portalUnlocked = false;
          this.bossMode = false;
          this.boss = null;
          this.shadowClone = null;              // ITERATION-2
          this.combo = { count: 0, timer: 0 }; // ITERATION-2
          this.screenShakeTimer = 0;            // ITERATION-2
          this.skills = [];
          this.damageNumbers = [];
          this.monsters = [];
          this.drops = [];
          this.particles.particles = [];        // ITERATION-2
          this.notification = { text: '', timer: 0, duration: 0 };
          this.playTime = 0;
          this.lastAfterimage = 0;
          this.camera.lockBoss = false;
          this.camera.x = 0;
          for (const controller of this.spawnControllers) {
            controller.activeMonster = null;
            controller.timer = rand(0, 1.5);
          }
          for (const controller of this.spawnControllers) {
            this.trySpawnController(controller, true);
          }
        }

        restart() {
          this.resetWorld();
          this.setState('playing');
        }

        setState(next) {
          this.state = next;
        }

        notify(text, duration = 1.6) {
          this.notification = { text, timer: duration, duration };
        }

        formatTime(seconds) {
          const mins = Math.floor(seconds / 60);
          const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
          return `${mins}:${secs}`;
        }

        trySpawnController(controller, immediate = false) {
          if (this.bossMode && !immediate) return;
          const platform = this.map.getSupportPlatform(controller.zone.x, controller.zone.y);
          const monster = new Monster(
            controller.definition,
            controller.zone.x,
            platform.y - controller.definition.height,
            controller,
          );
          monster.support = platform;
          controller.activeMonster = monster;
          this.monsters.push(monster);
        }

        spawnShadowMinion(x, y) {
          const def = CONFIG.MONSTERS.shadowMinion;
          const monster = new Monster(def, x, y - def.height, null);
          monster.support = { x: 3600, y: 640, w: 240, h: 80 };
          monster.direction = Math.random() > 0.5 ? 1 : -1;
          this.monsters.push(monster);
        }

        rollPlayerDamage(multiplier, guaranteedCrit) {
          // ITERATION-2: use equipment stats and combo multiplier
          const effAttack = this.player.getEffectiveAttack();
          const effCrit   = this.player.getEffectiveCritRate();
          const comboMult = 1 + Math.min(this.combo.count * 0.05, 1.0);
          let damage = effAttack * multiplier * comboMult;
          let isCrit = guaranteedCrit;
          if (!guaranteedCrit && Math.random() < effCrit) {
            damage *= CONFIG.PLAYER_STATS.critMulti;
            isCrit = true;
          }
          damage = Math.floor(damage * (0.9 + Math.random() * 0.2));
          return { damage, isCrit };
        }

        rollMonsterDamage(attack) {
          return Math.floor(attack * (0.85 + Math.random() * 0.3));
        }

        damageMonster(monster, roll, x, y, guaranteedCrit = false, stun = 0) {
          if (!monster || monster.state === 'dead') return;
          monster.hurt(roll.damage, stun);
          this.maxDamage = Math.max(this.maxDamage, roll.damage);
          this.damageNumbers.push(new DamageNumber(x, y, roll.damage, monster instanceof Boss ? 'boss' : (roll.isCrit || guaranteedCrit ? 'crit' : 'normal')));
          this.audio.play(monster.state === 'dead' ? 'monster_die' : 'monster_hit');
          // ITERATION-2: combo + particles
          this.combo.count++;
          this.combo.timer = 2.0;
          this.particles.emit(x, y, 4, { color: roll.isCrit ? '#FFD700' : '#FFFFFF', speed: 80, life: 0.4, gravity: -80 });
          if (monster.state === 'dead') {
            this.onMonsterKilled(monster);
          }
        }

        // ITERATION-2: screen shake helper
        screenShake(duration, intensity) {
          this.screenShakeTimer = Math.max(this.screenShakeTimer, duration);
          this.screenShakeIntensity = Math.max(this.screenShakeIntensity, intensity);
        }

        // ITERATION-2: archer arrow spawner
        spawnArcherArrow(archer, player) {
          const dx = (player.x + player.w / 2) - (archer.x + archer.w / 2);
          const dy = (player.y + player.h / 2) - (archer.y + archer.h / 2);
          const dist = Math.hypot(dx, dy) || 1;
          const speed = 380;
          this.skills.push(new Skill('archerArrow', {
            owner: archer,
            x: archer.x + archer.w / 2,
            y: archer.y + archer.h / 2 - 10,
            vx: (dx / dist) * speed,
            vy: (dy / dist) * speed,
            range: 420,
            duration: 2,
            effectData: { damage: Math.floor(archer.attack * (0.8 + Math.random() * 0.4)) },
          }));
        }

        // ITERATION-2: update shadow clone
        updateShadowClone(dt) {
          if (!this.shadowClone) return;
          const clone = this.shadowClone;
          clone.life -= dt;
          clone.animTime += dt;
          if (clone.life <= 0) { this.shadowClone = null; return; }
          // follow player with lerp
          clone.x = lerp(clone.x, this.player.x - clone.facing * 30, dt * 4);
          clone.y = lerp(clone.y, this.player.y, dt * 4);
          clone.facing = this.player.facing;
          // attack nearest monster every 1.5s
          clone.attackTimer = (clone.attackTimer || 0) - dt;
          if (clone.attackTimer <= 0) {
            clone.attackTimer = 1.5;
            const target = this.findNearestMonster(clone.x + clone.w / 2, clone.y + clone.h / 2, 200);
            if (target) {
              const dmg = Math.floor(this.player.getEffectiveAttack() * CONFIG.SKILLS.shadowCloneSkill.damageMulti);
              this.damageMonster(target, { damage: dmg, isCrit: false }, target.x + target.w / 2, target.y, false);
              this.particles.emit(clone.x + clone.w / 2, clone.y + clone.h / 2, 6, { color: '#9B30FF', speed: 100, life: 0.4 });
            }
          }
        }

        onMonsterKilled(monster) {
          if (!(monster instanceof Boss) && monster.kind !== 'shadowMinion') {
            this.killCount += 1;
            if (!this.portalUnlocked && this.killCount >= CONFIG.TARGET_KILLS) {
              this.portalUnlocked = true;
              this.notify('傳送門已解鎖，前往右側 Boss 門');
            }
          }
          this.spawnDrops(monster);
          if (monster.spawnController) {
            monster.spawnController.activeMonster = null;
            monster.spawnController.timer = monster.definition.respawnTime;
          }
        }

        spawnDrops(monster) {
          const table = CONFIG.DROP_TABLE[monster.kind];
          if (!table) return;
          const cx = monster.x + monster.w / 2;
          // ITERATION-2: death particles
          this.particles.emit(cx, monster.y + monster.h / 2, 10,
            { color: monster.kind === 'stoneGolem' ? '#888' : '#FF6600', speed: 140, life: 0.65, gravity: 120 });
          const spawnDrop = (kind, amount = 0, extra = {}) => {
            this.drops.push({
              kind, amount,
              x: cx, y: monster.y,
              w: 20, h: 20,
              vx: rand(-40, 40), vy: -rand(120, 220),
              age: 0, dead: false, ...extra,
            });
          };
          if (Math.random() < table.meso.chance) {
            spawnDrop('meso', randInt(table.meso.amount[0], table.meso.amount[1]));
          }
          if (Math.random() < table.hp_potion.chance) spawnDrop('hp_potion');
          if (Math.random() < table.mp_potion.chance) spawnDrop('mp_potion');
          // ITERATION-2: equipment drop
          if (table.equipment && Math.random() < table.equipment.chance) {
            const tierRoll = Math.random();
            const dt = CONFIG.EQUIPMENT.dropTiers;
            const tier = tierRoll < dt.epic ? 'epic' : tierRoll < dt.epic + dt.rare ? 'rare' : 'common';
            const types = Object.keys(CONFIG.EQUIPMENT.types);
            const eqType = types[Math.floor(Math.random() * types.length)];
            spawnDrop('equipment', 0, { eqType, tier, w: 22, h: 22 });
          }
        }

        spawnAfterimage(player) {
          if (this.time - this.lastAfterimage < 0.08) return;
          this.lastAfterimage = this.time;
          this.skills.push(new Skill('afterimage', {
            owner: player,
            x: player.x,
            y: player.y,
            duration: 0.2,
            effectData: {
              playerSnapshot: {
                ...player,
              },
            },
          }));
        }

        findNearestMonster(x, y, range) {
          let best = null;
          let bestDistance = range;
          for (const monster of this.getDamageableMonsters()) {
            const d = distance(x, y, monster.x + monster.w / 2, monster.y + monster.h / 2);
            if (d < bestDistance) {
              bestDistance = d;
              best = monster;
            }
          }
          return best;
        }

        getDamageableMonsters() {
          const monsters = this.monsters.filter((monster) => monster.state !== 'dead');
          if (this.boss) monsters.push(this.boss);
          return monsters.filter(Boolean);
        }

        updateDrops(dt) {
          for (const drop of this.drops) {
            drop.age += dt;
            drop.vy += 480 * dt;
            drop.x += drop.vx * dt;
            drop.y += drop.vy * dt;
            const ground = this.map.getGroundHeightAt(drop.x + drop.w / 2, drop.y);
            if (drop.y + drop.h >= ground) {
              drop.y = ground - drop.h;
              drop.vy *= -0.28;
              drop.vx *= 0.7;
              if (Math.abs(drop.vy) < 25) drop.vy = 0;
            }
            if (drop.age >= 30) {
              drop.dead = true;
            }
            if (overlap({ x: this.player.x, y: this.player.y, w: this.player.w, h: this.player.h }, drop)) {
              if (drop.kind === 'meso') {
                this.player.meso += drop.amount;
                this.particles.emit(drop.x, drop.y, 3, { color: '#FFD700', speed: 50, life: 0.3 });
              } else if (drop.kind === 'hp_potion') {
                this.player.hp = clamp(this.player.hp + 100, 0, this.player.getEffectiveMaxHP());
                this.damageNumbers.push(new DamageNumber(this.player.x + this.player.w / 2, this.player.y, '+100', 'heal'));
              } else if (drop.kind === 'mp_potion') {
                this.player.mp = clamp(this.player.mp + 80, 0, this.player.maxMP);
                this.damageNumbers.push(new DamageNumber(this.player.x + this.player.w / 2, this.player.y - 20, '+80', 'heal'));
              } else if (drop.kind === 'equipment') { // ITERATION-2
                this.player.equipment[drop.eqType] = { eqType: drop.eqType, tier: drop.tier };
                const tierCfg = CONFIG.EQUIPMENT.tiers[drop.tier];
                const typeCfg = CONFIG.EQUIPMENT.types[drop.eqType];
                this.notify(`✨${tierCfg.name} ${typeCfg.name} ${typeCfg.icon} 已裝備！`, 2.5);
                this.particles.emit(this.player.x + this.player.w / 2, this.player.y,
                  14, { color: tierCfg.color, speed: 160, life: 0.9, gravity: -40 });
              }
              this.audio.play('item_pickup');
              drop.dead = true;
            }
          }
          this.drops = this.drops.filter((drop) => !drop.dead);
        }

        updateSpawnControllers(dt) {
          for (const controller of this.spawnControllers) {
            if (controller.activeMonster || this.bossMode) continue;
            controller.timer -= dt;
            if (controller.timer <= 0) {
              this.trySpawnController(controller, false);
            }
          }
        }

        enterBossMode() {
          if (this.bossMode || !this.portalUnlocked) return;
          this.bossMode = true;
          this.camera.lockBoss = true;
          this.monsters = [];
          for (const controller of this.spawnControllers) {
            controller.activeMonster = null;
          }
          this.player.x = CONFIG.BOSS_PLAYER_SPAWN.x;
          this.player.y = CONFIG.BOSS_PLAYER_SPAWN.y - this.player.h;
          this.player.vx = 0;
          this.player.vy = 0;
          this.boss = new Boss(5680, 640 - CONFIG.BOSS.height); // ITERATION-2
          this.notify('暗影魔君現身');
        }

        updatePlaying(dt) {
          if (this.input.consume('pause')) {
            this.setState('pause');
            return;
          }

          this.playTime += dt;
          // ITERATION-2: combo timer
          if (this.combo.timer > 0) {
            this.combo.timer -= dt;
            if (this.combo.timer <= 0) this.combo.count = 0;
          }
          // ITERATION-2: screen shake
          if (this.screenShakeTimer > 0) {
            this.screenShakeTimer -= dt;
            if (this.screenShakeTimer <= 0) this.screenShakeIntensity = 0;
          }
          this.player.update(dt, this);
          this.updateSpawnControllers(dt);
          this.updateShadowClone(dt); // ITERATION-2
          this.particles.update(dt);  // ITERATION-2

          for (const monster of this.monsters) {
            monster.update(dt, this);
          }
          this.monsters = this.monsters.filter((monster) => !monster.dead);

          if (this.boss) {
            this.boss.update(dt, this);
            if (this.boss.dead) {
              this.boss = null;
            }
          }

          for (const skill of this.skills) {
            skill.update(dt, this);
          }
          this.skills = this.skills.filter((skill) => !skill.dead);

          for (const damageNumber of this.damageNumbers) {
            damageNumber.update(dt);
          }
          this.damageNumbers = this.damageNumbers.filter((item) => !item.dead);

          this.updateDrops(dt);

          if (this.portalUnlocked && !this.bossMode) {
            const portalRect = { x: CONFIG.PORTAL_X - 25, y: CONFIG.PORTAL_Y - 60, w: 50, h: 120 };
            if (overlap(this.player, portalRect)) {
              this.enterBossMode();
            }
          }

          this.notification.timer = Math.max(0, this.notification.timer - dt);
          this.camera.update();
        }

        update(dt) {
          this.time += dt;
          if (this.state === 'pause') {
            if (this.input.consume('pause')) {
              this.setState('playing');
            }
            return;
          }
          if (this.state !== 'playing') return;
          this.updatePlaying(dt);
        }

        render() {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);
          // ITERATION-2: screen shake
          if (this.screenShakeTimer > 0) {
            const shakeX = (Math.random() - 0.5) * this.screenShakeIntensity;
            const shakeY = (Math.random() - 0.5) * this.screenShakeIntensity;
            ctx.save();
            ctx.translate(shakeX, shakeY);
          }
          this.map.renderBackground(ctx, this.camera, this.time);
          this.map.renderWorld(ctx, this.camera, this.time);

          AssetManager.drawPortal(ctx, this.camera.worldToScreen(CONFIG.PORTAL_X), CONFIG.PORTAL_Y - 10, this.portalUnlocked, this.time);

          for (const drop of this.drops) {
            const screenX = this.camera.worldToScreen(drop.x);
            if (screenX < -40 || screenX > CONFIG.CANVAS_W + 40) continue;
            if (drop.kind === 'equipment') {
              AssetManager.drawEquipment(ctx, drop, screenX, drop.y); // ITERATION-2
            } else {
              AssetManager.drawDrop(ctx, drop, screenX, drop.y);
            }
          }

          for (const skill of this.skills) {
            skill.render(ctx, this.camera);
          }

          for (const monster of this.monsters) {
            monster.render(ctx, this.camera);
          }
          if (this.boss) {
            this.boss.render(ctx, this.camera);
          }

          const playerScreenX = this.camera.worldToScreen(this.player.x);
          ctx.save();
          if (this.player.damageFlash > 0) {
            ctx.globalAlpha = 0.75;
          }
          AssetManager.drawPlayer(ctx, this.player, playerScreenX, this.player.y);
          ctx.restore();

          // ITERATION-2: shadow clone
          if (this.shadowClone) {
            const cloneScreenX = this.camera.worldToScreen(this.shadowClone.x);
            AssetManager.drawShadowClone(ctx, this.shadowClone, cloneScreenX, this.shadowClone.y);
          }

          // ITERATION-2: particles
          this.particles.render(ctx, this.camera);

          for (const damageNumber of this.damageNumbers) {
            damageNumber.render(ctx, this.camera);
          }

          this.ui.render(ctx, this);

          // ITERATION-2: close screen shake transform
          if (this.screenShakeTimer > 0) ctx.restore();

          if (this.errorMessage) {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(40, 40, 1200, 120);
            ctx.fillStyle = '#FF7070';
            ctx.font = 'bold 18px Microsoft JhengHei';
            ctx.fillText(this.errorMessage, 60, 100);
          }
        }
      }

      const canvas = document.getElementById('gameCanvas');
      const game = new Game(canvas);
      let lastTime = 0;

      function gameLoop(timestamp) {
        try {
          const deltaTime = (timestamp - lastTime) / 1000;
          lastTime = timestamp;
          game.update(Math.min(deltaTime || 0, 0.05));
          game.render();
        } catch (error) {
          game.errorMessage = `執行錯誤：${error.message}`;
          console.error(error);
        } finally {
          game.input.endFrame();
          requestAnimationFrame(gameLoop);
        }
      }

      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
