<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151522" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="盜賊傳說" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-sMwjOdshdLIb0OdXdJ09VM+ae+jgTLIK49TNuYpvVeo=' 'sha256-MyHMNFcAIum3vAuLsfYazPNW+PIzRzsTe0iM5pZT7Ww='; style-src 'self'; img-src 'self' data: blob:; connect-src 'self';" />
  <title>盜賊傳說 — Phaser 3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container"></div>
  <div id="loading">載入中... 請稍候</div>
  <script>
    // 若 dist/bundle.js 不存在（開發環境），顯示提示
    window.addEventListener('error', function(e) {
      if (e.filename && e.filename.includes('bundle.js')) {
        document.getElementById('loading').innerHTML =
          '<p>請先執行 <code>npm install &amp;&amp; npm run build</code></p>' +
          '<p>詳細說明請參考 <a href="README.md" style="color:#6af">README.md</a></p>';
      }
    });
  </script>
  <script src="dist/bundle.js"></script>
  <script>
    document.getElementById('loading').style.display = 'none';
  </script>
</body>
</html>
