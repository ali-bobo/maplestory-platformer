name: Deploy to GitHub Pages

# 合併到 main 就把遊戲發布到 GitHub Pages（Settings → Pages → Source 要選 GitHub Actions）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dist/bundle.js、dist/version.json、sw.js 已由 build.yml 確認與原始碼一致，這裡直接打包靜態檔
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html style.css manifest.webmanifest sw.js _site/
          cp -r icons _site/
          mkdir -p _site/dist
          cp dist/bundle.js dist/version.json _site/dist/
          cp -r dist/assets _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
